<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#b5533a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="意大利行程">
<title>意大利 11 天自驾行程</title>
<style>
  :root{
    --bg:#f6f1e7; --card:#fffdf8; --ink:#2c2620; --muted:#8a7f70;
    --line:#e7dcc9; --brand:#b5533a; --brand2:#7a8b4f; --gold:#c8912e;
    --blue:#3f6d8c; --shadow:0 2px 10px rgba(60,40,20,.08);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1b1714; --card:#25201b; --ink:#efe7d9; --muted:#a99d8b;
      --line:#3a322a; --brand:#e0785c; --brand2:#a2b571; --gold:#e0b452;
      --blue:#7fb0cf; --shadow:0 2px 12px rgba(0,0,0,.4); }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",Roboto,Helvetica,sans-serif;
    line-height:1.55; padding-bottom:40px;
  }
  a{color:var(--blue);}

  /* Header */
  header{
    background:linear-gradient(135deg,var(--brand),#9a4430);
    color:#fff8ef; padding:16px 16px 12px; position:sticky; top:0; z-index:30;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
    padding-top:calc(16px + env(safe-area-inset-top));
  }
  .h-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.3px;}
  .h-sub{font-size:12.5px;opacity:.9;}
  .startrow{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:8px;opacity:.95;}
  .startrow input{
    border:none;border-radius:8px;padding:3px 7px;font-size:12px;
    background:rgba(255,255,255,.9);color:#3a2a1e;font-family:inherit;
  }

  /* Tab pills */
  nav{
    position:sticky; top:calc(var(--hh,72px)); z-index:20;
    background:var(--bg); border-bottom:1px solid var(--line);
    overflow-x:auto; white-space:nowrap; padding:8px 10px;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  nav::-webkit-scrollbar{display:none;}
  .pill{
    display:inline-block; padding:6px 12px; margin-right:6px; border-radius:999px;
    background:var(--card); border:1px solid var(--line); color:var(--muted);
    font-size:13px; cursor:pointer; user-select:none; font-weight:600;
  }
  .pill.active{background:var(--brand); color:#fff; border-color:var(--brand);}
  .pill .dnum{font-size:11px;opacity:.75;}

  main{max-width:640px;margin:0 auto;padding:14px 12px;}
  section.page{display:none;} section.page.show{display:block;}

  /* Overview */
  .lead{color:var(--muted);font-size:13.5px;margin:2px 0 14px;}
  .stats{display:flex;gap:8px;margin-bottom:14px;}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:10px;text-align:center;box-shadow:var(--shadow);}
  .stat b{display:block;font-size:20px;color:var(--brand);line-height:1.1;}
  .stat span{font-size:11px;color:var(--muted);}

  .mapwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:8px;box-shadow:var(--shadow);margin-bottom:16px;}
  .mapwrap svg{display:block;width:100%;height:auto;}

  .routelist{list-style:none;padding:0;margin:0;}
  .routelist li{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;
    border-bottom:1px dashed var(--line);cursor:pointer;}
  .routelist li:last-child{border-bottom:none;}
  .rl-num{flex:0 0 30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
  .rl-num.drive{background:var(--brand2);} .rl-num.mtn{background:var(--blue);}
  .rl-body{flex:1;min-width:0;}
  .rl-t{font-weight:600;font-size:14.5px;}
  .rl-d{font-size:12px;color:var(--muted);}
  .rl-km{font-size:11.5px;color:var(--gold);font-weight:600;white-space:nowrap;}

  /* Day card */
  .daycard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;}
  .dc-head{padding:14px 16px;background:linear-gradient(135deg,var(--brand),#9a4430);color:#fff8ef;}
  .dc-head.drive{background:linear-gradient(135deg,var(--brand2),#5f7040);}
  .dc-head.mtn{background:linear-gradient(135deg,var(--blue),#2f556e);}
  .dc-day{font-size:12px;opacity:.9;font-weight:600;letter-spacing:.5px;}
  .dc-title{font-size:20px;font-weight:700;margin:2px 0 0;}
  .dc-route{font-size:13px;opacity:.95;margin-top:4px;}
  .dc-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;}
  .badge{background:rgba(255,255,255,.22);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600;}

  .dc-body{padding:6px 16px 16px;}
  .block{padding:12px 0;border-bottom:1px solid var(--line);}
  .block:last-child{border-bottom:none;}
  .blk-h{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;
    color:var(--brand);margin-bottom:7px;text-transform:none;}
  .blk-h .ic{font-size:15px;}
  .list{margin:0;padding-left:2px;list-style:none;}
  .list li{position:relative;padding:3px 0 3px 16px;font-size:14px;}
  .list li::before{content:"";position:absolute;left:2px;top:11px;width:5px;height:5px;
    border-radius:50%;background:var(--gold);}
  .food li::before{background:var(--brand);}
  .rest-name{font-weight:600;}
  .rest-note{color:var(--muted);font-size:12.5px;}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px;
    margin-left:6px;vertical-align:middle;background:#e9d9b5;color:#8a6a1e;}
  @media (prefers-color-scheme: dark){.tag{background:#4a3d1e;color:#e0b452;}}

  .mapbtn{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#fff;
    text-decoration:none;padding:9px 14px;border-radius:10px;font-size:13.5px;font-weight:600;
    margin-top:2px;}
  .mapbtn.mini{background:transparent;color:var(--blue);border:1px solid var(--blue);padding:5px 10px;font-size:12px;}

  /* editable */
  .edit{display:block;width:100%;background:rgba(200,145,46,.07);border:1px dashed var(--line);
    border-radius:10px;padding:8px 10px;font-family:inherit;font-size:13.5px;color:var(--ink);
    resize:vertical;min-height:38px;line-height:1.5;}
  .edit:focus{outline:none;border-color:var(--gold);background:rgba(200,145,46,.12);}
  .edit::placeholder{color:var(--muted);opacity:.8;}
  .savehint{font-size:11px;color:var(--muted);margin-top:5px;}

  .ckhead{display:flex;justify-content:space-between;align-items:center;font-weight:700;
    color:var(--brand);margin:2px 0 10px;font-size:15px;}
  .ckhead b{font-size:12.5px;color:var(--muted);font-weight:600;}
  .cklist{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px;}
  .ckitem{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;}
  .ckitem:last-child{border-bottom:none;}
  .ckbox{width:20px;height:20px;margin-top:2px;accent-color:var(--brand2);flex:0 0 auto;}
  .ck-b{display:flex;flex-direction:column;}
  .ck-t{font-size:14.5px;font-weight:600;}
  .ck-d{font-size:12.5px;color:var(--muted);}
  .ckbox:checked ~ .ck-b .ck-t{text-decoration:line-through;color:var(--muted);}
  footer{text-align:center;color:var(--muted);font-size:11.5px;margin:22px 0 6px;padding:0 16px;}
  .disc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
    font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.5;}
</style>
</head>
<body>
<header>
  <div class="h-top">
    <h1>🇮🇹 意大利 11 天自驾</h1>

  <div class="h-sub">米兰 · 多洛米蒂 · 托斯卡纳 · 罗马</div>
  <div class="startrow">
    <span>出发日期</span>
    <input type="date" id="startDate">
    <span id="tripRange"></span>
  </div>
</header>

<nav id="nav"></nav>
<main id="main"></main>

/* 概览页 */
function overviewHTML(){

    return `<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="#b5533a" stroke="#fffdf8" stroke-width="1.5"/>

}

/* 构建导航与页面 */
function build(){
  let pills=`<span class="pill" data-tab="ov" onclick="go('ov')">概览</span>`;
  pills+=`<span class="pill" data-tab="ck" onclick="go('ck')">📋 预订</span>`;
  pills+=`<span class="pill" data-tab="pi" onclick="go('pi')">ℹ️ 实用</span>`;
  let pages=`<section class="page" id="pg-ov">${overviewHTML()}</section>`;
  pages+=`<section class="page" id="pg-ck">${checklistHTML()}</section>`;
  pages+=`<section class="page" id="pg-pi">${practicalHTML()}</section>`;
  TRIP.forEach(d=>{
    pills+=`<span class="pill" data-tab="${d.n}" onclick="go(${d.n})"><span class="dnum">D${d.n}</span> ${d.title.replace(/^.*?→\s*/,'').slice(0,5)}</span>`;
    pages+=`<section class="page" id="pg-${d.n}">${dayHTML(d)}</section>`;
  });
  nav.innerHTML=pills; main.innerHTML=pages;
  bindEdits(); bindChecks(); applyDates();
}

/* 清单勾选保存 */
function bindChecks(){
  document.querySelectorAll(".ckbox").forEach(el=>{
    const k=el.dataset.key;
    el.checked=localStorage.getItem("it_"+k)==="1";
    el.addEventListener("change",()=>{localStorage.setItem("it_"+k,el.checked?"1":"");updCkCount();});
  });
  updCkCount();
}
function updCkCount(){
  const all=document.querySelectorAll(".ckbox"); if(!all.length)return;
  const done=[...all].filter(c=>c.checked).length;
  const el=document.getElementById("ckCount"); if(el)el.textContent=`已完成 ${done} / ${all.length}`;
}

let current="ov";
function go(tab){
  current=String(tab);
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));
  const pg=$("#pg-"+tab); if(pg)pg.classList.add("show");
  document.querySelectorAll(".pill").forEach(p=>p.classList.toggle("active",p.dataset.tab===String(tab)));
  const ap=document.querySelector(`.pill[data-tab="${tab}"]`);
  if(ap)ap.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
  window.scrollTo({top:0,behavior:"smooth"});
}
window.go=go;

/* 编辑保存 */
function bindEdits(){
  document.querySelectorAll(".edit").forEach(el=>{
    const k=el.dataset.key;
    el.value=localStorage.getItem("it_"+k)||"";
    autresize(el);
    el.addEventListener("input",()=>{localStorage.setItem("it_"+k,el.value);autresize(el);});
  });
}
function autresize(el){el.style.height="auto";el.style.height=(el.scrollHeight+2)+"px";}

/* 日期计算 */
const startEl=$("#startDate");
function fmt(dt){return `${dt.getMonth()+1}月${dt.getDate()}日 周${"日一二三四五六"[dt.getDay()]}`;}
function applyDates(){
  const s=localStorage.getItem("it_start");
  if(s)startEl.value=s;
  const val=startEl.value;
  const rangeEl=$("#tripRange"), todayLbl=$("#todayLbl");
  if(!val){ rangeEl.textContent=""; document.querySelectorAll("[data-datebadge]").forEach(b=>b.textContent="📅 未设日期"); todayLbl.textContent=""; return;}
  const start=new Date(val+"T00:00:00");
  const end=new Date(start); end.setDate(end.getDate()+10);
  rangeEl.textContent=`→ ${fmt(end)}`;
  // 每天日期
  document.querySelectorAll("[data-datebadge]").forEach(b=>{
    const n=+b.dataset.datebadge; const dt=new Date(start); dt.setDate(dt.getDate()+n-1);
    b.textContent="📅 "+fmt(dt);
  });
  // 今天高亮
  const now=new Date(); now.setHours(0,0,0,0);
  const diff=Math.round((now-start)/86400000);
  document.querySelectorAll(".pill").forEach(p=>p.style.boxShadow="");
  if(diff>=0&&diff<=10){
    const dnum=diff+1;
    todayLbl.textContent=`今天 · Day ${dnum}`;
    const tp=document.querySelector(`.pill[data-tab="${dnum}"]`);
    if(tp)tp.style.boxShadow="0 0 0 2px var(--gold)";
  } else if(diff<0){
    todayLbl.textContent=`还有 ${-diff} 天出发`;
  } else {
    todayLbl.textContent="旅途愉快 🍷";
  }
}
startEl.addEventListener("change",()=>{localStorage.setItem("it_start",startEl.value);applyDates();});

/* 让 header 高度参与 sticky 定位 */
function setHH(){document.documentElement.style.setProperty("--hh",document.querySelector("header").offsetHeight+"px");}

build();
go("ov");
setHH(); window.addEventListener("resize",setHH);

/* 首次进入若已过出发日则跳到今天 */
(function jumpToday(){
  const s=localStorage.getItem("it_start"); if(!s)return;
  const start=new Date(s+"T00:00:00"); const now=new Date(); now.setHours(0,0,0,0);
  const diff=Math.round((now-start)/86400000);
  if(diff>=0&&diff<=10) go(diff+1);
})();
